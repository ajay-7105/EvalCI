name: summarize-openai
prompt: prompts/summarize.txt # no placeholder: system message; the case input is the user message
model:
  provider: openai
  name: gpt-4o-mini
  temperature: 0.2

cases:
  - id: refund-policy
    input: "Customers may return any item within 30 days of delivery for a full refund, provided it is unused and in its original packaging."
    assertions:
      # Anthropic has no embeddings, so the embedding model comes from another provider.
      - type: semantic-similarity
        expected: "Items can be returned within 30 days for a full refund if unused."
        embedding: { provider: openai, model: text-embedding-3-small }
      - type: llm-rubric
        rubric: "The summary is a single short sentence and mentions the 30 day return window."
        judge: { provider: anthropic, model: claude-haiku-4-5-20251001 }
